<body>

    <main class="wrapper">
        <section class="dashboard-container">
            <header class="header">

            </header>
            <nav class="tabs" aria-label="기간별 인기 게시물 탭">
                <button class="tab-btn active" data-period="daily" aria-pressed="true">일간</button>
                <button class="tab-btn" data-period="weekly" aria-pressed="false">주간</button>

            </ul>

        <footer class="info-text">ⓘ 해당 기간 내에 작성한 게시물의 누적 조회수<br>© red52.kr</footer>

    <script>
        const SITE_URL = 'https://red52.kr';
        let popularData = {};

        const mockData = {
            daily: [
                { title: "데이터 로드 실패 - 기본 데이터", comment_count: "0", document_srl: "", mid: "" }
            ],
            weekly: [],
            monthly: []
        };

        function formatUpdateTime(serverTimestamp) {
            if (serverTimestamp) {
                const date = new Date(parseInt(serverTimestamp) * 1000);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const mins = String(date.getMinutes()).padStart(2, '0');
                return `${year}.${month}.${day} ${hours}:${mins} Update`;
            }

            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60 * 1000);
            const kst = new Date(utc + (9 * 60 * 60 * 1000));

            if (kst.getHours() < 4 || (kst.getHours() === 4 && kst.getMinutes() < 30)) {
                kst.setDate(kst.getDate() - 1);
            }

            const year = kst.getFullYear();
            const month = String(kst.getMonth() + 1).padStart(2, '0');
            const day = String(kst.getDate()).padStart(2, '0');

            return `${year}.${month}.${day} 04:30 기준`;
        }

        function renderList(posts) {
            if (!posts || posts.length === 0) {
                return '<li class="status-msg error-msg">조건에 맞는 데이터가 없습니다.</li>';
            }
            
            const fallbackImage = 'https://red52.kr/files/attach/xeicon/mobicon.png';
            
            return posts.map((post, index) => {
                const rankClass = index < 3 ? 'rank rank-top' : 'rank';
                const midPath = post.mid ? `/${post.mid}` : ''; 
                const url = `${SITE_URL}${midPath}/${post.document_srl}`;
                const safeTitle = (post.title || '제목 없음').trim(); 
                const commentCount = parseInt(post.comment_count) || 0;
                const commentHtml = commentCount > 0 ? `<span class="comment-count">[${commentCount}]</span>` : '';
                
                const thumbUrl = post.thumbnail ? `${SITE_URL}/${post.thumbnail}` : fallbackImage;

                // img 태그에 width, height, loading, decoding, 동적 alt 추가
                return `
                <li>
                    <span class="${rankClass}" aria-label="${index + 1}위">${index + 1}</span>
                    <a href="${url}" class="post-link" target="_blank" rel="noopener noreferrer" title="${safeTitle}">
                        <img src="${thumbUrl}" class="post-thumbnail" alt="${safeTitle} 썸네일" width="32" height="32" loading="lazy" decoding="async" onerror="this.src='${fallbackImage}'">
                        <span class="post-title">${safeTitle}</span>${commentHtml}
                    </a>
                </li>
                `;
            }).join('');
        }

        function injectItemListSchema(posts) {
            if (!posts || posts.length === 0) return;

            const itemListElement = posts.map((post, index) => {
                const midPath = post.mid ? `/${post.mid}` : ''; 
                return {
                    "@type": "ListItem",
                    "position": index + 1,
                    "name": (post.title || '제목 없음').trim(),
                    "url": `${SITE_URL}${midPath}/${post.document_srl}`
                };
            });

            const schema = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "name": "인기 BJ 야동 | Korean BJ Hot Video",
                "description": "인기 BJ 야동과 최신 AV 순위를 매일 업데이트. 한국 야동을 HD 고화질로 무료 스트리밍 및 다운로드 감상하세요.",
                "itemListElement": itemListElement
            };

            const existingSchema = document.getElementById('dynamic-itemlist-schema');
            if (existingSchema) existingSchema.remove();

            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.id = 'dynamic-itemlist-schema';
            script.text = JSON.stringify(schema);
            document.head.appendChild(script);
        }

        function updateTabUI(activePeriod) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isActive = btn.dataset.period === activePeriod;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive); // 접근성 상태 업데이트
            });
            
            const listEl = document.getElementById('post-list');
            const posts = popularData[activePeriod] || [];
            const topPosts = posts.slice(0, 10);
            
            listEl.innerHTML = renderList(topPosts);
            injectItemListSchema(topPosts);
        }

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    updateTabUI(e.target.dataset.period);
                });
            });
        }

        async function loadData() {
            let actualUpdateTime = null;
            try {
                const cacheBuster = Date.now();
                // fetch 우선순위를 높여 데이터를 가장 먼저 가져오게 지시 (우선순위 힌트 API)
                const response = await fetch(`https://red52.kr/popular_posts_api.php?_t=${cacheBuster}`, {
                    priority: 'high'
                });
                
                if(response.ok) {
                    actualUpdateTime = response.headers.get('X-Update-Time');
                    popularData = await response.json();
                } else {
                    throw new Error('API Error');
                }
            } catch (error) {
                console.warn('API Fetch Failed. Using Mock Data.', error);
                popularData = mockData;
            }
            
            document.getElementById('update-time').textContent = formatUpdateTime(actualUpdateTime);
            updateTabUI('daily');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTabs();
            loadData();
        });
    </script>
</body>
